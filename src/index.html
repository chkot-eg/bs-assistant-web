<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BS Assistant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* =====================================================
       Nexstep Launch Screen
       Shown inside <app-root> while Angular JS bundle
       loads and while APP_INITIALIZER runs (Microsoft
       auth redirect + token exchange + ERP mapping fetch).
       Angular replaces this content once the app renders.
       ===================================================== */
    body {
      margin: 0;
      padding: 0;
      background: #ebebeb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .launch-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ebebeb;
    }

    .launch-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.10);
      padding: 48px 56px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 380px;
      gap: 0;
    }

    .launch-logo {
      margin-bottom: 32px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .launch-logo .logo-dark { color: #1a1a2e; }
    .launch-logo .logo-red  { color: #c0392b; }

    .launch-progress-track {
      width: 100%;
      height: 3px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .launch-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7b1a1a, #c0392b);
      border-radius: 2px;
      animation: nexstep-progress 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes nexstep-progress {
      0%   { width: 0%; }
      40%  { width: 45%; }
      70%  { width: 68%; }
      90%  { width: 80%; }
      100% { width: 85%; }
    }

    .launch-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #aaaaaa;
      text-transform: uppercase;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Static loading screen — visible while Angular bootstraps
         and while APP_INITIALIZER handles Microsoft auth.
         Automatically replaced once Angular renders. -->
    <div class="launch-screen">
      <div class="launch-card">
        <div class="launch-logo">
          <span class="logo-dark">Nex</span><span class="logo-red">step</span>
        </div>
        <div class="launch-progress-track">
          <div class="launch-progress-fill"></div>
        </div>
        <span class="launch-label">Launching&hellip;</span>
      </div>
    </div>
  </app-root>
</body>
</html>
